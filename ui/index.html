<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trello Review Workbench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <div>
        <p class="eyebrow">Local Tooling</p>
        <h1>Trello Review Workbench</h1>
      </div>
      <div class="actions">
        <button id="refreshBoardsBtn" class="btn">Refresh Boards</button>
        <button id="copyMdBtn" class="btn btn-accent" disabled>Copy Markdown</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel boards-panel">
        <div class="panel-head">
          <h2>Boards</h2>
          <span id="identity" class="pill muted">Not loaded</span>
        </div>
        <input id="boardSearch" type="search" placeholder="Filter boards..." />
        <ul id="boardsList" class="list"></ul>
      </section>

      <section class="panel cards-panel">
        <div class="panel-head">
          <h2>Cards</h2>
          <div class="panel-controls">
            <label for="cardLimit">Limit</label>
            <input id="cardLimit" type="number" min="1" max="500" value="100" />
            <button id="loadCardsBtn" class="btn" disabled>Load Cards</button>
          </div>
        </div>
        <div id="selectedBoardMeta" class="meta-block muted">Select a board.</div>
        <ul id="cardsList" class="list card-list"></ul>
      </section>

      <section class="panel viewer-panel">
        <div class="panel-head">
          <h2>LLM Packet Preview</h2>
          <span id="cardBadge" class="pill">No card selected</span>
        </div>
        <div class="tabs">
          <button class="tab active" data-tab="markdown">Markdown Transcript</button>
          <button class="tab" data-tab="rendered">Rendered Transcript</button>
          <button class="tab" data-tab="json">Raw Packet JSON</button>
        </div>
        <div id="viewerState" class="meta-block muted">Select a card to fetch comments/checklists/attachments.</div>
        <pre id="markdownView" class="viewer tab-pane active"></pre>
        <div id="renderedView" class="viewer md-render tab-pane"></div>
        <pre id="jsonView" class="viewer tab-pane"></pre>
      </section>
    </main>

    <template id="boardItemTpl">
      <li><button class="list-item board-item"></button></li>
    </template>

    <template id="cardItemTpl">
      <li>
        <button class="list-item card-item">
          <span class="title"></span>
          <span class="sub"></span>
        </button>
      </li>
    </template>

    <script src="/app.js" defer></script>
  </body>
</html>
