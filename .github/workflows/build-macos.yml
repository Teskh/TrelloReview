name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [codex/package-macos]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and verify the app
        run: python scripts/build_macos.py
      - name: Save the app ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Trello-Review-macos-${{ matrix.arch }}
          path: dist/Trello-Review-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30
